<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>Sasuke Guide - Client Server</title>

    <style>

        body {
            font-family: sans-serif;
            margin: 0;
            padding: 0;
            background-color: #121212;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            font-size: 1.2rem;
            margin: 10px 0;
        }

        #video-container {
            position: relative;
            width: 90%;
            max-width: 400px;
            aspect-ratio: 3 / 4;
            background-color: black;
            border-radius: 8px;
            overflow: hidden;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .btn {
            width: 90%;
            max-width: 400px;
            padding: 15px;
            margin: 15px 0;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
        }

        .btn:disabled {
            background-color: #555;
        }

        #status-area {
            width: 85%;
            max-width: 380px;
            padding: 15px;
            background-color: #1e1e1e;
            border-radius: 8px;
            font-size: 0.9rem;
            white-space: pre-wrap;
            border: 1px solid #333;
        }

        #audio-results {
            width: 90%;
            max-width: 400px;
            margin-bottom: 15px;
        }

        .audio-card {
            margin-bottom: 15px;
            padding: 12px;
            background-color: #2a2a2a;
            border-radius: 8px;
            border: 1px solid #444;
        }

        .audio-title {
            font-weight: bold;
            margin-bottom: 8px;
            font-size: 1rem;
        }

        .audio-distance {
            font-size: 0.85rem;
            margin-bottom: 8px;
            color: #cccccc;
        }

        .audio-card audio {
            width: 100%;
        }

        canvas {
            display: none;
        }

    </style>
</head>

<body>

    <h1>旧豊田佐助邸 画像認識音声ガイド</h1>

    <div id="video-container">
        <video id="camera-view" autoplay playsinline muted></video>
    </div>

    <button id="match-btn" class="btn" disabled>
        カメラ起動中...
    </button>

    <div id="status-area">
        システムを初期化しています...
    </div>

    <canvas id="capture-canvas" width="640" height="480"></canvas>

    <!--
        自動判定なら1位だけ、
        自信がない場合は上位3つの音声をここに表示する
    -->
    <div id="audio-results"></div>

    <script>

        // =========================================================
        // ngrok を起動するたびに毎回ここを書き換える
        // =========================================================
        const SERVER_IP = "https://gallantly-gosling-refrain.ngrok-free.dev";

        // =========================================================
        // 音声ファイル
        // =========================================================
        const AUDIO_FILES = {

            "お気に入りの部屋": "production_audio/お気に入りの部屋.wav",
            "ガス灯": "production_audio/ガス灯.wav",
            "きんだみ襖": "production_audio/きんだみ襖.wav",
            "シャンデリア": "production_audio/シャンデリア.wav",
            "ステレオ": "production_audio/ステレオ.wav",
            "トイレ": "production_audio/トイレ.wav",
            "引手": "production_audio/引手.wav",
            "夏障子": "production_audio/夏障子.wav",
            "換気口": "production_audio/換気口.wav",
            "筋交": "production_audio/筋交.wav",
            "波型無双連子": "production_audio/波型無双連子.wav",
            "覆輪目地": "production_audio/覆輪目地.wav"
        };

        const video = document.getElementById('camera-view');
        const canvas = document.getElementById('capture-canvas');
        const matchBtn = document.getElementById('match-btn');
        const statusArea = document.getElementById('status-area');
        const audioResults = document.getElementById('audio-results');

        // =========================================================
        // 最初のクリックで音声再生権限を取得
        // =========================================================
        let audioUnlocked = false;

        async function initCamera() {

            try {

                const stream =
                    await navigator.mediaDevices.getUserMedia({

                        video: {
                            facingMode: "environment",
                            width: 640,
                            height: 480
                        },

                        audio: false
                    });

                video.srcObject = stream;

                statusArea.textContent =
                    "準備完了。\n展示物を映して判定開始ボタンを押してください。";

                matchBtn.textContent = "判定開始";
                matchBtn.disabled = false;

            } catch (err) {

                statusArea.textContent =
                    `カメラ起動エラー:\n${err.message}`;
            }
        }

        // =========================================================
        // 音声プレイヤーを1つ作る関数
        // =========================================================
        function createAudioCard(
            rank,
            item
        ) {

            const audioPath =
                AUDIO_FILES[item.name];

            // 音声ファイルが登録されていなければ表示しない
            if (!audioPath) {
                return null;
            }

            const wrapper =
                document.createElement("div");

            wrapper.className =
                "audio-card";

            const title =
                document.createElement("div");

            title.className =
                "audio-title";

            title.textContent =
                `${rank}位：${item.name}`;

            const distance =
                document.createElement("div");

            distance.className =
                "audio-distance";

            distance.textContent =
                `距離：${item.min.toFixed(4)}`;

            const audio =
                document.createElement("audio");

            audio.controls = true;
            audio.src = audioPath;

            wrapper.appendChild(title);
            wrapper.appendChild(distance);
            wrapper.appendChild(audio);

            return wrapper;
        }

        // =========================================================
        // 判定開始
        // =========================================================
        matchBtn.addEventListener('click', async () => {

            matchBtn.disabled = true;

            // 前回の音声候補を消す
            audioResults.innerHTML = "";

            // =====================================================
            // 初回クリック時だけ音声再生権限を取得
            // =====================================================
            if (!audioUnlocked) {

                try {

                    const testAudio =
                        new Audio(AUDIO_FILES["ガス灯"]);

                    testAudio.volume = 0;

                    await testAudio.play();

                    testAudio.pause();
                    testAudio.currentTime = 0;

                    audioUnlocked = true;

                    console.log(
                        "音声権限取得成功"
                    );

                } catch (err) {

                    console.log(
                        "音声権限取得失敗",
                        err
                    );
                }
            }

            statusArea.textContent =
                "サーバーへ画像送信中...\n照合しています...";

            const ctx =
                canvas.getContext('2d');

            canvas.width =
                video.videoWidth;

            canvas.height =
                video.videoHeight;

            ctx.drawImage(
                video,
                0,
                0,
                canvas.width,
                canvas.height
            );

            canvas.toBlob(async (blob) => {

                const formData =
                    new FormData();

                formData.append(
                    'image',
                    blob,
                    'capture.jpg'
                );

                try {

                    const response =
                        await fetch(
                            `${SERVER_IP}/predict`,
                            {
                                method: 'POST',
                                body: formData
                            }
                        );

                    if (!response.ok) {

                        throw new Error(
                            `HTTPエラー: ${response.status}`
                        );
                    }

                    const result =
                        await response.json();

                    let logText = "";

                    logText +=
                        "===== 判定結果 =====\n\n";

                    logText +=
                        `1位: ${result.best_match}\n`;

                    logText +=
                        `距離: ${result.distance.toFixed(4)}\n`;

                    logText +=
                        `1つ目の閾値: ${result.threshold}\n`;

                    // 2位が存在する場合
                    if (result.gap !== null) {

                        logText +=
                            `1位と2位の距離差: ${result.gap.toFixed(4)}\n`;

                        logText +=
                            `2つ目の閾値: ${result.gap_threshold}\n`;
                    }

                    logText += "\n";

                    // =================================================
                    // まず1つ目の閾値を確認
                    // =================================================
                    if (!result.success) {

                        logText +=
                            "判定に失敗しました\n";

                        logText +=
                            "距離が閾値以上です。\n";

                        logText +=
                            "角度を変えて撮影し直してください。";

                        statusArea.textContent =
                            logText;

                        audioResults.innerHTML =
                            "";

                        return;
                    }

                    // =================================================
                    // 1つ目の閾値はクリア
                    // =================================================

                    // -------------------------------------------------
                    // 2つ目の閾値：
                    // 1位と2位の距離差が0.03未満
                    // → 自信がないため上位3つを表示
                    // -------------------------------------------------
                    if (result.low_confidence) {

                        logText +=
                            "距離差が小さいため、上位3件を表示します。\n";

                        // 上位3件
                        const top3 =
                            result.ranking.slice(0, 3);

                        top3.forEach(
                            (item, index) => {

                                const card =
                                    createAudioCard(
                                        index + 1,
                                        item
                                    );

                                if (card) {

                                    audioResults.appendChild(
                                        card
                                    );
                                }
                            }
                        );

                        statusArea.textContent =
                            logText +
                            "\n候補から聞きたい音声を選択してください。";

                    } else {

                        // -------------------------------------------------
                        // 2つ目の閾値もクリア
                        // → 1位を自動採用
                        // -------------------------------------------------
                        logText +=
                            "距離差が十分に大きいため、1位を採用します。\n";

                        const bestItem =
                            result.ranking[0];

                        const card =
                            createAudioCard(
                                1,
                                bestItem
                            );

                        if (card) {

                            audioResults.appendChild(
                                card
                            );

                            statusArea.textContent =
                                logText +
                                "\n1位の音声ガイドを表示しました。\n" +
                                "再生ボタンを押してください。";

                        } else {

                            statusArea.textContent =
                                logText +
                                "\n音声ファイルが見つかりません。";
                        }
                    }

                } catch (err) {

                    statusArea.textContent =
                        `\n通信エラー\n\n` +
                        `■ 確認すること\n\n` +
                        `1. app.py が起動しているか\n` +
                        `2. ngrok が起動しているか\n` +
                        `3. SERVER_IP が正しいか\n` +
                        `4. Flask が落ちていないか\n\n` +
                        `詳細:\n${err.message}\n`;

                } finally {

                    matchBtn.disabled = false;
                }

            }, 'image/jpeg', 0.8);

        });

        window.addEventListener(
            'DOMContentLoaded',
            initCamera
        );

    </script>

</body>
</html>
