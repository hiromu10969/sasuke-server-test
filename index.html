<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>Sasuke Guide - Client Server</title>

    <style>
        body {
            font-family: sans-serif;
            margin: 0;
            padding: 0;
            background-color: #121212;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            font-size: 1.2rem;
            margin: 10px 0;
        }

        #video-container {
            position: relative;
            width: 90%;
            max-width: 400px;
            aspect-ratio: 3 / 4;
            background-color: black;
            border-radius: 8px;
            overflow: hidden;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .btn {
            width: 90%;
            max-width: 400px;
            padding: 15px;
            margin: 15px 0 10px 0;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
        }

        .btn:disabled {
            background-color: #555;
        }

        /* Spotify プレイヤーの設置エリア */
        #embed-iframe-container {
            width: 90%;
            max-width: 400px;
            margin-bottom: 15px;
            min-height: 152px;
            display: none;
        }

        #status-area {
            width: 85%;
            max-width: 380px;
            padding: 15px;
            background-color: #1e1e1e;
            border-radius: 8px;
            font-size: 0.9rem;
            white-space: pre-wrap;
            border: 1px solid #333;
            margin-bottom: 15px;
        }

        #audio-results {
            width: 90%;
            max-width: 400px;
            margin-bottom: 20px;
        }

        .audio-card {
            margin-bottom: 12px;
            padding: 12px;
            background-color: #2a2a2a;
            border-radius: 8px;
            border: 1px solid #444;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .audio-info {
            flex-grow: 1;
        }

        .audio-title {
            font-weight: bold;
            margin-bottom: 4px;
            font-size: 1rem;
        }

        .audio-distance {
            font-size: 0.85rem;
            color: #cccccc;
        }

        .play-btn {
            background-color: #1db954;
            color: white;
            border: none;
            border-radius: 20px;
            padding: 8px 14px;
            font-size: 0.85rem;
            font-weight: bold;
            cursor: pointer;
            white-space: nowrap;
            margin-left: 10px;
        }

        .play-btn:active {
            background-color: #1aa34a;
        }

        canvas {
            display: none;
        }
    </style>

    <!-- Spotify iFrame API のスクリプト -->
    <script src="https://open.spotify.com/embed/iframe-api/v1" async></script>
</head>

<body>

    <h1>旧豊田佐助邸 画像認識音声ガイド</h1>

    <div id="video-container">
        <video id="camera-view" autoplay playsinline muted></video>
    </div>

    <button id="match-btn" class="btn" disabled>
        カメラ起動中...
    </button>

    <!-- Spotify iFrame プレイヤーが生成される場所 -->
    <div id="embed-iframe-container">
        <div id="embed-iframe"></div>
    </div>

    <div id="status-area">
        システムを初期化しています...
    </div>

    <canvas id="capture-canvas" width="640" height="480"></canvas>

    <!-- 自信度が低い場合の上位候補一覧エリア -->
    <div id="audio-results"></div>

    <script>
        // =========================================================
        // ngrok を起動するたびに毎回ここを書き換える
        // =========================================================
        const SERVER_IP = "https://gallantly-gosling-refrain.ngrok-free.dev";

        // =========================================================
        // 各展示物に対応する Spotify ポッドキャストのエピソード
        // =========================================================
        const SPOTIFY_EPISODES = {
            "お気に入りの部屋": "https://open.spotify.com/episode/3c02kQl95palK7PEBBpSdz?si=f04c0f972185467b",
            "ガス灯": "https://open.spotify.com/episode/78j0VmMwSKyguwanEBLbEv?si=90b1771f97d14b6e",
            "きんだみ襖": "https://open.spotify.com/episode/5xXtixpynrC8JlXOoP3V9b?si=03670599321e479d",
            "シャンデリア": "https://open.spotify.com/episode/0DvrHzuccMeEtGWMjDASwO?si=b931f0e4aa2541aa",
            "ステレオ": "https://open.spotify.com/episode/3c02kQl95palK7PEBBpSdz?si=f04c0f972185467b",
            "トイレ": "https://open.spotify.com/episode/6nLezXa07BedIgkEicr3gI?si=4c4c2a285b9840b3",
            "引手": "https://open.spotify.com/episode/3c02kQl95palK7PEBBpSdz?si=f04c0f972185467b",
            "夏障子": "https://open.spotify.com/episode/3c02kQl95palK7PEBBpSdz?si=f04c0f972185467b",
            "換気口": "https://open.spotify.com/episode/5x764PkVzDgiFCYg2ggqRS?si=2a5b717b214b4bbf",
            "筋交": "https://open.spotify.com/episode/7HMlKfKZyujAcvR7OY1y3v?si=1def4d606fdf49b3",
            "波型無双連子": "https://open.spotify.com/episode/3c02kQl95palK7PEBBpSdz?si=f04c0f972185467b",
            "覆輪目地": "https://open.spotify.com/episode/3c02kQl95palK7PEBBpSdz?si=f04c0f972185467b"
        };

        const video = document.getElementById('camera-view');
        const canvas = document.getElementById('capture-canvas');
        const matchBtn = document.getElementById('match-btn');
        const statusArea = document.getElementById('status-area');
        const playerContainer = document.getElementById('embed-iframe-container');
        const audioResults = document.getElementById('audio-results');

        let spotifyIFrameAPI = null;
        let embedController = null;

        // Spotify API の準備完了時
        window.onSpotifyIframeApiReady = (IFrameAPI) => {
            spotifyIFrameAPI = IFrameAPI;
            console.log("Spotify IFrame API 準備完了");
        };

        async function initCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        facingMode: "environment",
                        width: 640,
                        height: 480
                    },
                    audio: false
                });

                video.srcObject = stream;
                statusArea.textContent =
                    "準備完了。\n展示物を映して判定開始ボタンを押してください。";

                matchBtn.textContent = "判定開始";
                matchBtn.disabled = false;

            } catch (err) {
                statusArea.textContent =
                    `カメラ起動エラー:\n${err.message}`;
            }
        }

        // =========================================================
        // Web URL を spotify:episode:ID に変換
        // =========================================================
        function parseToSpotifyUri(rawUri) {
            if (rawUri && rawUri.startsWith("http")) {
                const episodeId =
                    rawUri.split("/episode/")[1]?.split("?")[0];

                if (episodeId) {
                    return `spotify:episode:${episodeId}`;
                }
            }

            return rawUri;
        }

        // =========================================================
        // Spotify プレイヤーを表示・再生
        // =========================================================
        function playSpotifyEpisode(targetUri) {
            if (!spotifyIFrameAPI) {
                console.error("Spotify API 未準備");
                return;
            }

            const cleanUri = parseToSpotifyUri(targetUri);

            playerContainer.style.display = 'block';

            if (embedController) {
                embedController.loadUri(cleanUri);
                embedController.play();

            } else {
                const element =
                    document.getElementById('embed-iframe');

                const options = {
                    width: '100%',
                    height: '152',
                    uri: cleanUri
                };

                spotifyIFrameAPI.createController(
                    element,
                    options,
                    (Controller) => {
                        embedController = Controller;
                        embedController.play();
                    }
                );
            }
        }

        // =========================================================
        // 上位候補カードを作成
        // =========================================================
        function createSpotifyCandidateCard(rank, item) {

            const rawUri =
                SPOTIFY_EPISODES[item.name];

            if (!rawUri) {
                return null;
            }

            const card =
                document.createElement("div");

            card.className =
                "audio-card";

            const infoDiv =
                document.createElement("div");

            infoDiv.className =
                "audio-info";

            const title =
                document.createElement("div");

            title.className =
                "audio-title";

            title.textContent =
                `${rank}位：${item.name}`;

            const distance =
                document.createElement("div");

            distance.className =
                "audio-distance";

            distance.textContent =
                `距離：${item.min.toFixed(4)}`;

            infoDiv.appendChild(title);
            infoDiv.appendChild(distance);

            const selectBtn =
                document.createElement("button");

            selectBtn.className =
                "play-btn";

            selectBtn.textContent =
                "Spotifyで再生";

            selectBtn.addEventListener(
                "click",
                () => {
                    playSpotifyEpisode(rawUri);
                }
            );

            card.appendChild(infoDiv);
            card.appendChild(selectBtn);

            return card;
        }

        // =========================================================
        // 判定開始
        // =========================================================
        matchBtn.addEventListener('click', async () => {

            matchBtn.disabled = true;

            // 前回の候補をクリア
            audioResults.innerHTML = "";

            // 前回のSpotifyプレイヤーを隠す
            playerContainer.style.display = 'none';

            statusArea.textContent =
                "サーバーへ画像送信中...\n照合しています...";

            const ctx =
                canvas.getContext('2d');

            canvas.width =
                video.videoWidth;

            canvas.height =
                video.videoHeight;

            ctx.drawImage(
                video,
                0,
                0,
                canvas.width,
                canvas.height
            );

            canvas.toBlob(async (blob) => {

                const formData =
                    new FormData();

                formData.append(
                    'image',
                    blob,
                    'capture.jpg'
                );

                try {

                    const response =
                        await fetch(
                            `${SERVER_IP}/predict`,
                            {
                                method: 'POST',
                                body: formData
                            }
                        );

                    if (!response.ok) {
                        throw new Error(
                            `HTTPエラー: ${response.status}`
                        );
                    }

                    const result =
                        await response.json();

                    let logText = "";

                    logText +=
                        "===== 判定結果 =====\n\n";

                    logText +=
                        `1位: ${result.best_match}\n`;

                    logText +=
                        `距離: ${result.distance.toFixed(4)}\n`;

                    logText +=
                        `1つ目の閾値: ${result.threshold}\n`;

                    if (result.gap !== null) {

                        logText +=
                            `1位と2位の距離差: ${result.gap.toFixed(4)}\n`;

                        logText +=
                            `2つ目の閾値: ${result.gap_threshold}\n`;
                    }

                    logText += "\n";

                    // =================================================
                    // 1つ目の閾値
                    // 距離 >= 0.60 → 再撮影
                    // =================================================
                    if (!result.success) {

                        logText +=
                            "判定に失敗しました\n";

                        logText +=
                            "距離が閾値以上です。\n";

                        logText +=
                            "角度を変えて撮影し直してください。";

                        statusArea.textContent =
                            logText;

                        return;
                    }

                    // =================================================
                    // 2つ目の閾値
                    // 距離差 < 0.03 → 上位3件を表示
                    // =================================================
                    if (result.low_confidence) {

                        logText +=
                            "距離差が小さいため、上位3件を表示します。\n";

                        const top3 =
                            result.ranking.slice(0, 3);

                        top3.forEach(
                            (item, index) => {

                                const card =
                                    createSpotifyCandidateCard(
                                        index + 1,
                                        item
                                    );

                                if (card) {
                                    audioResults.appendChild(card);
                                }
                            }
                        );

                        statusArea.textContent =
                            logText +
                            "\n候補から聞きたい音声を選択してください。";

                    } else {

                        // =================================================
                        // 2つ目の閾値もクリア
                        // → 1位のSpotifyを採用
                        // =================================================
                        logText +=
                            "距離差が十分に大きいため、1位を採用します。\n";

                        const bestUri =
                            SPOTIFY_EPISODES[result.best_match];

                        if (bestUri && spotifyIFrameAPI) {

                            // 1位のSpotifyを再生
                            playSpotifyEpisode(bestUri);

                            statusArea.textContent =
                                logText +
                                "\n1位のSpotifyポッドキャストを再生します。";

                        } else {

                            statusArea.textContent =
                                logText +
                                "\nSpotify URI または Player が見つかりません。";
                        }
                    }

                } catch (err) {

                    statusArea.textContent =
                        `\n通信エラー\n\n` +
                        `■ 確認すること\n\n` +
                        `1. app.py が起動しているか\n` +
                        `2. ngrok が起動しているか\n` +
                        `3. SERVER_IP が正しいか\n` +
                        `4. Flask が落ちていないか\n\n` +
                        `詳細:\n${err.message}\n`;

                } finally {

                    matchBtn.disabled = false;
                }

            }, 'image/jpeg', 0.8);
        });

        window.addEventListener(
            'DOMContentLoaded',
            initCamera
        );

    </script>

</body>
</html>
