<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sasuke Guide - Client Server</title>

    <style>
        body {
            font-family: sans-serif;
            margin: 0;
            padding: 0;
            background-color: #121212;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            font-size: 1.2rem;
            margin: 10px 0;
        }

        .screen {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .hidden {
            display: none !important;
        }

        #video-container {
            position: relative;
            width: 90%;
            max-width: 400px;
            aspect-ratio: 3 / 4;
            background-color: black;
            border-radius: 8px;
            overflow: hidden;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .btn {
            width: 90%;
            max-width: 400px;
            padding: 15px;
            margin: 15px 0 10px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
        }

        .btn:disabled {
            background-color: #555;
        }

        .message-banner {
            width: 85%;
            max-width: 380px;
            padding: 12px 15px;
            background-color: #e6a23c;
            color: #121212;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: bold;
            margin-bottom: 15px;
            text-align: center;
            box-sizing: border-box;
        }

        #status-area {
            width: 85%;
            max-width: 380px;
            padding: 15px;
            background-color: #1e1e1e;
            border-radius: 8px;
            font-size: 0.9rem;
            white-space: pre-wrap;
            border: 1px solid #333;
            margin-bottom: 15px;
            box-sizing: border-box;
        }

        #embed-iframe-container {
            width: 90%;
            max-width: 400px;
            margin-bottom: 15px;
            min-height: 152px;
            display: none;
        }

        #audio-results {
            width: 90%;
            max-width: 400px;
            margin-bottom: 10px;
        }

        .audio-card {
            margin-bottom: 12px;
            padding: 12px;
            background-color: #2a2a2a;
            border-radius: 8px;
            border: 1px solid #444;
        }

        .audio-title {
            font-weight: bold;
            margin-bottom: 4px;
            font-size: 1rem;
        }

        .audio-distance {
            font-size: 0.85rem;
            color: #ccc;
            margin-bottom: 8px;
        }

        .candidate-player {
            width: 100%;
            min-height: 152px;
        }

        #back-btn {
            background-color: #555;
            margin-top: 5px;
            margin-bottom: 20px;
        }

        canvas {
            display: none;
        }

        #feedback-area {
            width: 85%;
            max-width: 380px;
            padding: 12px 15px;
            background-color: #1e1e1e;
            border-radius: 8px;
            border: 1px solid #333;
            margin-bottom: 15px;
            box-sizing: border-box;
            text-align: center;
        }

        #feedback-question {
            font-size: 0.95rem;
            margin-bottom: 10px;
        }

        #feedback-buttons {
            display: flex;
            gap: 10px;
        }

        .feedback-btn {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            color: white;
        }

        #feedback-yes-btn {
            background-color: #28a745;
        }

        #feedback-no-btn {
            background-color: #d9534f;
        }

        .feedback-btn:disabled {
            background-color: #555;
            cursor: default;
        }

        #feedback-thanks {
            font-size: 0.9rem;
            color: #8fd19e;
        }
    </style>
</head>

<body>

    <!-- 画面①：カメラ画面 -->
    <div id="camera-screen" class="screen">
        <h1>旧豊田佐助邸 画像認識音声ガイド</h1>
        <div id="video-container">
            <video id="camera-view" autoplay playsinline muted></video>
        </div>
        <button id="match-btn" class="btn" disabled>カメラ起動中...</button>
    </div>

    <!-- 画面②：結果画面 -->
    <div id="result-screen" class="screen hidden">
        <h1>判定結果</h1>
        <div id="candidate-message" class="message-banner hidden">
            候補が複数あります。該当するものを選択してください。
        </div>
        <div id="embed-iframe-container">
            <div id="embed-iframe"></div>
        </div>
        <div id="audio-results"></div>
        <div id="status-area">判定結果を表示しています...</div>
        <div id="feedback-area" class="hidden">
            <div id="feedback-question">正しく識別されましたか？</div>
            <div id="feedback-buttons">
                <button id="feedback-yes-btn" class="feedback-btn">はい</button>
                <button id="feedback-no-btn" class="feedback-btn">いいえ</button>
            </div>
            <div id="feedback-thanks" class="hidden">ご回答ありがとうございました。</div>
        </div>
        <button id="back-btn" class="btn">もう一度判定</button>
    </div>

    <canvas id="capture-canvas" width="640" height="480"></canvas>

    <!-- Spotify API -->
    <script>
        const SERVER_IP = "https://gallantly-gosling-refrain.ngrok-free.dev";

        const SPOTIFY_EPISODES = {
            "お気に入りの部屋": "https://open.spotify.com/episode/3c02kQl95palK7PEBBpSdz?si=f04c0f972185467b",
            "ガス灯": "https://open.spotify.com/episode/78j0VmMwSKyguwanEBLbEv?si=90b1771f97d14b6e",
            "きんだみ襖": "https://open.spotify.com/episode/5xXtixpynrC8JlXOoP3V9b?si=03670599321e479d",
            "シャンデリア": "https://open.spotify.com/episode/0DvrHzuccMeEtGWMjDASwO?si=b931f0e4aa2541aa",
            "ステレオ": "https://open.spotify.com/episode/3c02kQl95palK7PEBBpSdz?si=f04c0f972185467b",
            "トイレ": "https://open.spotify.com/episode/6nLezXa07BedIgkEicr3gI?si=4c4c2a285b9840b3",
            "引手": "https://open.spotify.com/episode/3c02kQl95palK7PEBBpSdz?si=f04c0f972185467b",
            "夏障子": "https://open.spotify.com/episode/3c02kQl95palK7PEBBpSdz?si=f04c0f972185467b",
            "換気口": "https://open.spotify.com/episode/5x764PkVzDgiFCYg2ggqRS?si=2a5b717b214b4bbf",
            "筋交": "https://open.spotify.com/episode/7HMlKfKZyujAcvR7OY1y3v?si=1def4d606fdf49b3",
            "波型無双連子": "https://open.spotify.com/episode/3c02kQl95palK7PEBBpSdz?si=f04c0f972185467b",
            "覆輪目地": "https://open.spotify.com/episode/3c02kQl95palK7PEBBpSdz?si=f04c0f972185467b"
        };

        let spotifyIFrameAPI = null;
        let embedController = null;

        window.onSpotifyIframeApiReady = (IFrameAPI) => {
            spotifyIFrameAPI = IFrameAPI;
        };
    </script>
    <script src="https://open.spotify.com/embed/iframe-api/v1" async></script>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const cameraScreen = document.getElementById("camera-screen");
            const resultScreen = document.getElementById("result-screen");
            const video = document.getElementById("camera-view");
            const canvas = document.getElementById("capture-canvas");
            const matchBtn = document.getElementById("match-btn");
            const backBtn = document.getElementById("back-btn");
            const statusArea = document.getElementById("status-area");
            const playerContainer = document.getElementById("embed-iframe-container");
            const audioResults = document.getElementById("audio-results");
            const candidateMessage = document.getElementById("candidate-message");

            // 正誤フィードバック関連の要素
            const feedbackArea = document.getElementById("feedback-area");
            const feedbackYesBtn = document.getElementById("feedback-yes-btn");
            const feedbackNoBtn = document.getElementById("feedback-no-btn");
            const feedbackThanks = document.getElementById("feedback-thanks");

            let currentStream = null;

            // 直近の判定結果に紐づく画像ファイル名（フィードバック送信時に使用）
            let lastResultFilename = null;

            // カメラの起動処理
            async function startCamera() {
                matchBtn.disabled = true;
                matchBtn.textContent = "カメラ起動中...";

                try {
                    // 既存ストリームがあれば念のため停止
                    stopCamera();

                    currentStream = await navigator.mediaDevices.getUserMedia({
                        video: { facingMode: "environment", width: 640, height: 480 },
                        audio: false
                    });
                    video.srcObject = currentStream;
                    await video.play();

                    matchBtn.textContent = "判定開始";
                    matchBtn.disabled = false;
                } catch (err) {
                    matchBtn.textContent = "カメラ起動エラー";
                    matchBtn.disabled = true;
                    console.error("カメラ起動失敗:", err);
                }
            }

            // カメラの完全停止処理
            function stopCamera() {
                if (currentStream) {
                    currentStream.getTracks().forEach(track => track.stop());
                    currentStream = null;
                }
                video.srcObject = null;
            }

            // カメラ画面を表示
            async function showCameraScreen() {
                cameraScreen.classList.remove("hidden");
                resultScreen.classList.add("hidden");

                // カメラを再起動して正確な描画サイズを復元
                await startCamera();
            }

            // 結果画面を表示（カメラ停止）
            function showResultScreen() {
                stopCamera(); // 結果画面表示中にカメラを停止してサイズ崩れを予防
                cameraScreen.classList.add("hidden");
                resultScreen.classList.remove("hidden");
                window.scrollTo(0, 0);
            }

            // フィードバックUIを初期状態にリセット
            function resetFeedbackUI() {
                feedbackArea.classList.add("hidden");
                feedbackThanks.classList.add("hidden");
                feedbackYesBtn.classList.remove("hidden");
                feedbackNoBtn.classList.remove("hidden");
                feedbackYesBtn.disabled = false;
                feedbackNoBtn.disabled = false;
                lastResultFilename = null;
            }

            // フィードバックボタンを表示
            function showFeedbackUI(filename) {
                lastResultFilename = filename;
                feedbackArea.classList.remove("hidden");
                feedbackThanks.classList.add("hidden");
                feedbackYesBtn.classList.remove("hidden");
                feedbackNoBtn.classList.remove("hidden");
                feedbackYesBtn.disabled = false;
                feedbackNoBtn.disabled = false;
            }

            // フィードバックをサーバーへ送信
            function sendFeedback(isCorrect) {
                if (!lastResultFilename) return;

                feedbackYesBtn.disabled = true;
                feedbackNoBtn.disabled = true;

                fetch(`${SERVER_IP}/feedback`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "ngrok-skip-browser-warning": "true"
                    },
                    body: JSON.stringify({
                        filename: lastResultFilename,
                        correct: isCorrect
                    })
                })
                .then((response) => response.json())
                .then(() => {
                    feedbackYesBtn.classList.add("hidden");
                    feedbackNoBtn.classList.add("hidden");
                    feedbackThanks.classList.remove("hidden");
                })
                .catch((err) => {
                    console.error("フィードバック送信失敗:", err);
                    feedbackYesBtn.disabled = false;
                    feedbackNoBtn.disabled = false;
                });
            }

            feedbackYesBtn.addEventListener("click", () => sendFeedback(true));
            feedbackNoBtn.addEventListener("click", () => sendFeedback(false));

            function parseToSpotifyUri(rawUri) {
                if (rawUri && rawUri.startsWith("http")) {
                    const episodeId = rawUri.split("/episode/")[1]?.split("?")[0];
                    if (episodeId) return `spotify:episode:${episodeId}`;
                }
                return rawUri;
            }

            function playSpotifyEpisode(targetUri) {
                if (!spotifyIFrameAPI) return;
                const cleanUri = parseToSpotifyUri(targetUri);
                playerContainer.style.display = "block";

                if (embedController) {
                    embedController.loadUri(cleanUri);
                    embedController.play();
                } else {
                    const element = document.getElementById("embed-iframe");
                    spotifyIFrameAPI.createController(
                        element,
                        { width: "100%", height: "152", uri: cleanUri },
                        (Controller) => {
                            embedController = Controller;
                            embedController.play();
                        }
                    );
                }
            }

            function createSpotifyCandidateCard(rank, item) {
                const rawUri = SPOTIFY_EPISODES[item.name];
                if (!rawUri) return null;

                const card = document.createElement("div");
                card.className = "audio-card";

                const title = document.createElement("div");
                title.className = "audio-title";
                title.textContent = `${rank}位：${item.name}`;

                const distance = document.createElement("div");
                distance.className = "audio-distance";
                distance.textContent = `距離：${item.min.toFixed(4)}`;

                const player = document.createElement("div");
                player.className = "candidate-player";
                player.id = `candidate-player-${rank}-${Date.now()}`;

                card.appendChild(title);
                card.appendChild(distance);
                card.appendChild(player);

                if (spotifyIFrameAPI) {
                    const cleanUri = parseToSpotifyUri(rawUri);
                    spotifyIFrameAPI.createController(
                        player,
                        { width: "100%", height: "152", uri: cleanUri },
                        () => {}
                    );
                }
                return card;
            }

            matchBtn.addEventListener("click", () => {
                matchBtn.disabled = true;
                audioResults.innerHTML = "";
                playerContainer.style.display = "none";
                candidateMessage.classList.add("hidden");
                resetFeedbackUI();
                statusArea.textContent = "サーバーへ画像送信中...\n照合しています...";

                const ctx = canvas.getContext("2d");
                canvas.width = video.videoWidth || 640;
                canvas.height = video.videoHeight || 480;
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

                canvas.toBlob((blob) => {
                    if (!blob) {
                        statusArea.textContent = "画像データの取得に失敗しました。";
                        matchBtn.disabled = false;
                        return;
                    }

                    const formData = new FormData();
                    formData.append("image", blob, "capture.jpg");

                    fetch(`${SERVER_IP}/predict`, {
                        method: "POST",
                        body: formData,
                        headers: {
                            "ngrok-skip-browser-warning": "true"
                        }
                    })
                    .then((response) => {
                        if (!response.ok) {
                            throw new Error(`HTTPエラー: ${response.status}`);
                        }
                        return response.json();
                    })
                    .then((result) => {
                        let logText = "===== 判定詳細 =====\n\n";
                        logText += `1位: ${result.best_match}\n`;
                        logText += `距離: ${result.distance.toFixed(4)}\n`;
                        logText += `1つ目の閾値: ${result.threshold}\n`;

                        if (result.gap !== null && result.gap !== undefined) {
                            logText += `1位と2位の距離差: ${result.gap.toFixed(4)}\n`;
                            logText += `2つ目の閾値: ${result.gap_threshold}\n`;
                        }

                        showResultScreen();

                        if (!result.success) {
                            logText += "\n判定に失敗しました\n距離が閾値以上です。\n角度を変えて撮影し直してください。";
                            statusArea.textContent = logText;
                            return;
                        }

                        // 判定に成功した場合のみ、正誤フィードバックを受け付ける
                        if (result.filename) {
                            showFeedbackUI(result.filename);
                        }

                        if (result.low_confidence) {
                            candidateMessage.classList.remove("hidden");
                            logText += "\n※距離差が小さいため候補を表示しています。";
                            statusArea.textContent = logText;

                            const top3 = result.ranking.slice(0, 3);
                            top3.forEach((item, index) => {
                                const card = createSpotifyCandidateCard(index + 1, item);
                                if (card) audioResults.appendChild(card);
                            });
                        } else {
                            logText += "\n距離差が十分に大きいため1位を採用しました。";
                            statusArea.textContent = logText;

                            const bestUri = SPOTIFY_EPISODES[result.best_match];
                            if (bestUri && spotifyIFrameAPI) {
                                playSpotifyEpisode(bestUri);
                            } else {
                                statusArea.textContent = logText + "\nSpotify URIが見つかりません。";
                            }
                        }
                    })
                    .catch((err) => {
                        showResultScreen();
                        statusArea.textContent =
                            `\n通信エラー\n\n` +
                            `■ 確認すること\n` +
                            `1. Flask (app.py) が起動しているか\n` +
                            `2. ngrok が起動しているか\n` +
                            `3. ngrokの警告ページで止まっていないか\n\n` +
                            `詳細:\n${err.message}\n`;
                    })
                    .finally(() => {
                        matchBtn.disabled = false;
                    });
                }, "image/jpeg", 0.8);
            });

            backBtn.addEventListener("click", () => {
                audioResults.innerHTML = "";
                candidateMessage.classList.add("hidden");
                resetFeedbackUI();
                statusArea.textContent = "判定結果を表示しています...";
                playerContainer.style.display = "none";
                showCameraScreen();
            });

            // 初期化時にカメラ起動
            startCamera();
        });
    </script>
</body>
</html>
