<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sasuke Guide - Client Server</title>

    <style>
        body {
            font-family: sans-serif;
            margin: 0;
            padding: 0;
            background-color: #121212;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            font-size: 1.2rem;
            margin: 10px 0;
        }

        .screen {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .hidden {
            display: none !important;
        }

        #video-container {
            position: relative;
            width: 90%;
            max-width: 400px;
            aspect-ratio: 3 / 4;
            background-color: black;
            border-radius: 8px;
            overflow: hidden;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .btn {
            width: 90%;
            max-width: 400px;
            padding: 15px;
            margin: 15px 0 10px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
        }

        .btn:disabled {
            background-color: #555;
        }

        #switch-camera-btn {
            background-color: #3b6ea5;
            margin-top: 0;
            padding: 10px;
            font-size: 0.95rem;
        }

        #switch-camera-btn:disabled {
            background-color: #555;
        }

        .message-banner {
            width: 85%;
            max-width: 380px;
            padding: 12px 15px;
            background-color: #e6a23c;
            color: #121212;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: bold;
            margin-bottom: 15px;
            text-align: center;
            box-sizing: border-box;
        }

        #player-notice {
            width: 85%;
            max-width: 380px;
            padding: 10px 15px;
            background-color: #2a2a2a;
            color: #ccc;
            border-radius: 8px;
            font-size: 0.85rem;
            margin-bottom: 10px;
            text-align: center;
            box-sizing: border-box;
            border: 1px solid #444;
        }

        #retry-message {
            width: 85%;
            max-width: 380px;
            padding: 12px 15px;
            background-color: #d9534f;
            color: white;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            margin-bottom: 15px;
            text-align: center;
            box-sizing: border-box;
        }

        #status-area {
            width: 85%;
            max-width: 380px;
            padding: 15px;
            background-color: #1e1e1e;
            border-radius: 8px;
            font-size: 0.9rem;
            white-space: pre-wrap;
            border: 1px solid #333;
            margin-bottom: 15px;
            box-sizing: border-box;
        }

        #embed-iframe-container {
            width: 90%;
            max-width: 400px;
            margin-bottom: 15px;
            min-height: 152px;
            display: none;
        }

        #audio-results {
            width: 90%;
            max-width: 400px;
            margin-bottom: 10px;
        }

        .audio-card {
            margin-bottom: 12px;
            padding: 12px;
            background-color: #2a2a2a;
            border-radius: 8px;
            border: 1px solid #444;
        }

        .audio-title {
            font-weight: bold;
            margin-bottom: 4px;
            font-size: 1rem;
        }

        .audio-distance {
            font-size: 0.85rem;
            color: #ccc;
            margin-bottom: 8px;
        }

        /* 部屋の確認用画像（3枚）。認識用DBの画像とは別物 */
        .room-images {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 10px;
        }

        .room-images img {
            flex: 1;
            min-width: 0;
            width: 33.33%;
            height: auto;
            border-radius: 6px;
        }

        /* 「この部屋のガイドを聞く」ボタン（カード内なので幅100%） */
        .listen-btn {
            width: 100%;
            max-width: none;
            margin: 0;
        }

        /* Spotifyプレイヤー置き場。ボタンを押すまでは高さ0で非表示 */
        .player-wrap {
            height: 0;
            overflow: hidden;
        }

        .player-wrap.open {
            height: auto;
            margin-top: 10px;
        }

        .room-note {
            font-size: 0.8rem;
            color: #e6a23c;
            margin-top: 8px;
        }

        #back-btn {
            background-color: #555;
            margin-top: 5px;
            margin-bottom: 20px;
        }

        canvas {
            display: none;
        }

        /* サーバーへ送信した画像のプレビュー */
        #captured-area {
            width: 90%;
            max-width: 400px;
            margin-bottom: 15px;
            text-align: center;
        }

        #captured-image {
            width: 100%;
            max-height: 240px;
            object-fit: contain;
            background-color: black;
            border-radius: 8px;
            display: block;
        }

        #captured-caption {
            font-size: 0.8rem;
            color: #aaa;
            margin-top: 6px;
        }

        /* 判定中インジケーター */
        #judging-indicator {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 12px;
            font-size: 1.1rem;
            font-weight: bold;
        }

        .spinner {
            width: 22px;
            height: 22px;
            border: 3px solid #555;
            border-top-color: #28a745;
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        #feedback-area {
            width: 85%;
            max-width: 380px;
            padding: 12px 15px;
            background-color: #1e1e1e;
            border-radius: 8px;
            border: 1px solid #333;
            margin-bottom: 15px;
            box-sizing: border-box;
            text-align: center;
        }

        #feedback-question {
            font-size: 0.95rem;
            margin-bottom: 10px;
        }

        #feedback-buttons {
            display: flex;
            gap: 10px;
        }

        .feedback-btn {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            color: white;
        }

        #feedback-yes-btn {
            background-color: #28a745;
        }

        #feedback-no-btn {
            background-color: #d9534f;
        }

        .feedback-btn:disabled {
            background-color: #555;
            cursor: default;
        }

        #feedback-thanks {
            font-size: 0.9rem;
            color: #8fd19e;
        }
    </style>
</head>

<body>

    <!-- 画面①：カメラ画面 -->
    <div id="camera-screen" class="screen">
        <h1>旧豊田佐助邸 画像認識音声ガイド</h1>
        <div id="shooting-guide" class="message-banner">
            部屋には入らず、<br>廊下から部屋を撮影してください。
        </div>
        <div id="video-container">
            <video id="camera-view" autoplay playsinline muted></video>
        </div>
        <button id="match-btn" class="btn" disabled>カメラ起動中...</button>
        <button id="switch-camera-btn" class="btn" disabled>カメラ切替（現在：外カメラ）</button>
    </div>

    <!-- 画面②：結果画面 -->
    <div id="result-screen" class="screen hidden">
        <h1>判定結果</h1>
        <div id="captured-area">
            <img id="captured-image" alt="判定に使用した画像">
            <div id="captured-caption">判定に使用した画像</div>
            <div id="judging-indicator" class="hidden">
                <div class="spinner"></div>
                <span>判定中...</span>
            </div>
        </div>
        <div id="candidate-message" class="message-banner hidden">
            候補が複数あります。該当するものを選択してください。
        </div>
        <div id="player-notice" class="hidden">
            再生ボタンが押せない場合、もう一度撮影してください
        </div>
        <div id="embed-iframe-container">
            <div id="embed-iframe"></div>
        </div>
        <div id="audio-results"></div>
        <div id="feedback-area" class="hidden">
            <div id="feedback-question">正しいガイドが表示されましたか？</div>
            <div id="feedback-buttons">
                <button id="feedback-yes-btn" class="feedback-btn">はい</button>
                <button id="feedback-no-btn" class="feedback-btn">いいえ</button>
            </div>
            <div id="feedback-thanks" class="hidden">ご回答ありがとうございました。</div>
        </div>
        <div id="retry-message" class="hidden">角度を変えて撮影し直してください</div>
        <button id="back-btn" class="btn">もう一度判定</button>
        <div id="status-area">判定結果を表示しています...</div>
    </div>

    <canvas id="capture-canvas" width="640" height="480"></canvas>

    <!-- Spotify API -->
    <script>
        const SERVER_IP = "https://gallantly-gosling-refrain.ngrok-free.dev";

        const SPOTIFY_EPISODES = {
            "1": "https://open.spotify.com/episode/5OkFo8MVrH4v7mRpUMr1NW?si=8ae3204964ec4f58",
            "2": "https://open.spotify.com/episode/7gEXu87MHXzKNOJwySsm3O?si=8c34d505291e4163",
            "3": "https://open.spotify.com/episode/1AxpLa4msdL23b8sMIWKwo?si=fb466180ee814320",
            "4": "https://open.spotify.com/episode/7k8GQwIGb4EG0F5HHFryBH?si=0383ba1c534745db",
            "5": "https://open.spotify.com/episode/1co3mI4qgXwyHOK8ZqC9MB?si=32c359cf137d4b80",
            "6": "https://open.spotify.com/episode/5dwEiIQzqykqAvWIVrPbat?si=79bbb543d84f4310",
            "7": "https://open.spotify.com/episode/0srmEaV9yVhgb6sX8pzkOb?si=2f2f80f5e42a442b",
            "8": "https://open.spotify.com/episode/4grx7YMkcj0sfHVESwxF3Z?si=5a9f32bf863048bc",
            "9": "https://open.spotify.com/episode/2smfPcW0Rb3WcqIYPbDrJ4?si=a434e8072642482c",
            "10": "https://open.spotify.com/episode/6UoIZ09o97xLgXJgcoc2C1?si=968d0728537f4ef9",
            "11": "https://open.spotify.com/episode/6drmpI99ElZcZ2lGrIq6Lk?si=8db3d823bedf49f6",
            "お手洗い": "https://open.spotify.com/episode/5lWKXiYQcgbmDiXcb44ICf?si=dd2228a1eca7458f"
        };

        // 画面に表示する部屋名（キーはサーバーが返す部屋名。URL・画像フォルダ名にはキーをそのまま使う）
        const ROOM_DISPLAY_NAMES = {
            "1": "洋館1階・応接間",
            "2": "和館1階・佐助翁の居間",
            "3": "和館1階・佐助翁の食堂",
            "4": "和館1階・佐助翁の寝室",
            "5": "和館1階・仏間",
            "6": "和館2階・一の間",
            "7": "和館2階・三の間",
            "8": "和館2階・二の間",
            "9": "和館2階・北東の間",
            "10": "洋館2階・和洋折衷の客室",
            "11": "洋館2階・奥の客室",
            "お手洗い": "当時のお手洗い"
        };
        function getRoomLabel(name) {
            return ROOM_DISPLAY_NAMES[name] || name;
        }

        // 部屋の確認用画像（認識用DBの画像とは別物）
        // 配置: index.html と同じ場所の room-images/<部屋名>/1.jpg, 2.jpg, 3.jpg
        const ROOM_IMAGE_DIR = "room-images";
        const ROOM_IMAGE_FILES = ["1.jpg", "2.jpg", "3.jpg"];

        let spotifyIFrameAPI = null;
        let embedController = null;

        window.onSpotifyIframeApiReady = (IFrameAPI) => {
            spotifyIFrameAPI = IFrameAPI;
        };
    </script>
    <script src="https://open.spotify.com/embed/iframe-api/v1" async></script>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const cameraScreen = document.getElementById("camera-screen");
            const resultScreen = document.getElementById("result-screen");
            const video = document.getElementById("camera-view");
            const canvas = document.getElementById("capture-canvas");
            const matchBtn = document.getElementById("match-btn");
            const switchCameraBtn = document.getElementById("switch-camera-btn");
            const backBtn = document.getElementById("back-btn");
            const statusArea = document.getElementById("status-area");
            const playerContainer = document.getElementById("embed-iframe-container");
            const audioResults = document.getElementById("audio-results");
            const candidateMessage = document.getElementById("candidate-message");
            const playerNotice = document.getElementById("player-notice");
            const retryMessage = document.getElementById("retry-message");

            // 送信画像のプレビューと判定中表示の要素
            const capturedImage = document.getElementById("captured-image");
            const judgingIndicator = document.getElementById("judging-indicator");

            // 正誤フィードバック関連の要素
            const feedbackArea = document.getElementById("feedback-area");
            const feedbackYesBtn = document.getElementById("feedback-yes-btn");
            const feedbackNoBtn = document.getElementById("feedback-no-btn");
            const feedbackThanks = document.getElementById("feedback-thanks");

            let currentStream = null;

            // 現在選択中のカメラ（"environment"=外カメラ / "user"=インカメラ）
            let currentFacingMode = "environment";

            // 直近の判定結果に紐づく画像ファイル名（フィードバック送信時に使用）
            let lastResultFilename = null;

            // 送信画像プレビュー用のオブジェクトURL（不要になったら解放する）
            let capturedUrl = null;

            // 切替ボタンの表示を現在のカメラに合わせて更新
            function updateSwitchLabel() {
                const label = currentFacingMode === "environment" ? "外カメラ" : "インカメラ";
                switchCameraBtn.textContent = `カメラ切替（現在：${label}）`;
            }

            // 指定した向きのカメラを取得（まず厳密指定、だめなら通常指定にフォールバック）
            async function getCameraStream(mode) {
                try {
                    return await navigator.mediaDevices.getUserMedia({
                        video: { facingMode: { exact: mode }, width: 640, height: 480 },
                        audio: false
                    });
                } catch (e) {
                    console.warn(`facingMode exact ${mode} 失敗:`, e);
                    return await navigator.mediaDevices.getUserMedia({
                        video: { facingMode: mode, width: 640, height: 480 },
                        audio: false
                    });
                }
            }

            // カメラの起動処理
            async function startCamera() {
                matchBtn.disabled = true;
                switchCameraBtn.disabled = true;
                matchBtn.textContent = "カメラ起動中...";
                updateSwitchLabel();

                try {
                    // 既存ストリームがあれば念のため停止
                    stopCamera();

                    currentStream = await getCameraStream(currentFacingMode);
                    video.srcObject = currentStream;
                    await video.play();

                    matchBtn.textContent = "判定開始";
                    matchBtn.disabled = false;
                } catch (err) {
                    matchBtn.textContent = "カメラ起動エラー";
                    matchBtn.disabled = true;
                    console.error("カメラ起動失敗:", err);
                } finally {
                    // 起動に失敗しても、もう一方のカメラを試せるよう切替ボタンは有効に戻す
                    switchCameraBtn.disabled = false;
                }
            }

            // カメラの完全停止処理
            function stopCamera() {
                if (currentStream) {
                    currentStream.getTracks().forEach(track => track.stop());
                    currentStream = null;
                }
                video.srcObject = null;
            }

            // カメラ画面を表示
            async function showCameraScreen() {
                cameraScreen.classList.remove("hidden");
                resultScreen.classList.add("hidden");

                // カメラを再起動して正確な描画サイズを復元
                await startCamera();
            }

            // 結果画面を表示（カメラ停止）
            function showResultScreen() {
                stopCamera(); // 結果画面表示中にカメラを停止してサイズ崩れを予防
                cameraScreen.classList.add("hidden");
                resultScreen.classList.remove("hidden");
                window.scrollTo(0, 0);
            }

            // フィードバックUIを初期状態にリセット
            function resetFeedbackUI() {
                feedbackArea.classList.add("hidden");
                feedbackThanks.classList.add("hidden");
                feedbackYesBtn.classList.remove("hidden");
                feedbackNoBtn.classList.remove("hidden");
                feedbackYesBtn.disabled = false;
                feedbackNoBtn.disabled = false;
                lastResultFilename = null;
            }

            // フィードバックボタンを表示
            function showFeedbackUI(filename) {
                lastResultFilename = filename;
                feedbackArea.classList.remove("hidden");
                feedbackThanks.classList.add("hidden");
                feedbackYesBtn.classList.remove("hidden");
                feedbackNoBtn.classList.remove("hidden");
                feedbackYesBtn.disabled = false;
                feedbackNoBtn.disabled = false;
            }

            // フィードバックをサーバーへ送信
            function sendFeedback(isCorrect) {
                if (!lastResultFilename) return;

                feedbackYesBtn.disabled = true;
                feedbackNoBtn.disabled = true;

                fetch(`${SERVER_IP}/feedback`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "ngrok-skip-browser-warning": "true"
                    },
                    body: JSON.stringify({
                        filename: lastResultFilename,
                        correct: isCorrect
                    })
                })
                .then((response) => response.json())
                .then(() => {
                    feedbackYesBtn.classList.add("hidden");
                    feedbackNoBtn.classList.add("hidden");
                    feedbackThanks.classList.remove("hidden");
                })
                .catch((err) => {
                    console.error("フィードバック送信失敗:", err);
                    feedbackYesBtn.disabled = false;
                    feedbackNoBtn.disabled = false;
                });
            }

            feedbackYesBtn.addEventListener("click", () => sendFeedback(true));
            feedbackNoBtn.addEventListener("click", () => sendFeedback(false));

            function parseToSpotifyUri(rawUri) {
                if (rawUri && rawUri.startsWith("http")) {
                    const episodeId = rawUri.split("/episode/")[1]?.split("?")[0];
                    if (episodeId) return `spotify:episode:${episodeId}`;
                }
                return rawUri;
            }

            function playSpotifyEpisode(targetUri) {
                if (!spotifyIFrameAPI) return;
                const cleanUri = parseToSpotifyUri(targetUri);
                playerContainer.style.display = "block";

                if (embedController) {
                    embedController.loadUri(cleanUri);
                    embedController.play();
                } else {
                    const element = document.getElementById("embed-iframe");
                    spotifyIFrameAPI.createController(
                        element,
                        { width: "100%", height: "152", uri: cleanUri },
                        (Controller) => {
                            embedController = Controller;
                            embedController.play();
                        }
                    );
                }
            }

            // 複数候補表示時に、来館者が実際に再生した候補をサーバーへ記録
            function sendCandidateSelection(candidateName) {
                if (!lastResultFilename) return;

                fetch(`${SERVER_IP}/select_candidate`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "ngrok-skip-browser-warning": "true"
                    },
                    body: JSON.stringify({
                        filename: lastResultFilename,
                        candidate: candidateName
                    })
                }).catch((err) => {
                    console.error("候補選択の記録に失敗:", err);
                });
            }

            // 部屋カード（部屋名・確認用画像3枚・「この部屋のガイドを聞く」ボタン）を作る
            // onListen: ボタンが初めて押されたときに1回だけ呼ばれる（候補選択の記録用）
            function createRoomCard(titleText, item, onListen) {
                const rawUri = SPOTIFY_EPISODES[item.name];

                const card = document.createElement("div");
                card.className = "audio-card";

                const title = document.createElement("div");
                title.className = "audio-title";
                title.textContent = titleText;
                card.appendChild(title);

                // 確認用の画像3枚（読み込めない画像は枠だけ残して非表示）
                const images = document.createElement("div");
                images.className = "room-images";
                ROOM_IMAGE_FILES.forEach((file) => {
                    const img = document.createElement("img");
                    img.src = `${ROOM_IMAGE_DIR}/${encodeURIComponent(item.name)}/${file}`;
                    img.alt = `${getRoomLabel(item.name)}の画像`;
                    img.onerror = () => { img.style.visibility = "hidden"; };
                    images.appendChild(img);
                });
                card.appendChild(images);

                const listenBtn = document.createElement("button");
                listenBtn.className = "btn listen-btn";
                listenBtn.textContent = "この部屋のガイドを聞く";
                card.appendChild(listenBtn);

                // 音声URLが未登録の部屋はボタンを押せなくする
                if (!rawUri) {
                    listenBtn.disabled = true;
                    listenBtn.textContent = "この部屋のガイドは準備中です";
                    return card;
                }

                const note = document.createElement("div");
                note.className = "room-note hidden";
                note.textContent = "プレイヤーを読み込み中です。少し待ってからもう一度押してください。";
                card.appendChild(note);

                const playerWrap = document.createElement("div");
                playerWrap.className = "player-wrap";
                card.appendChild(playerWrap);

                let controller = null;
                let creating = false;
                let playRequested = false;
                let listenLogged = false;

                // Spotifyプレイヤーを（非表示のまま）先に作っておく。
                // ボタン押下時にそのまま play() を呼べるので、自動再生されやすくなる
                function ensureController() {
                    if (controller || creating || !spotifyIFrameAPI) return;
                    creating = true;
                    const mount = document.createElement("div");
                    playerWrap.appendChild(mount);
                    spotifyIFrameAPI.createController(
                        mount,
                        { width: "100%", height: "152", uri: parseToSpotifyUri(rawUri) },
                        (Controller) => {
                            controller = Controller;
                            creating = false;
                            if (playRequested) Controller.play();
                        }
                    );
                }

                // 他の部屋のボタンが押されたときに、この部屋のプレイヤーを閉じる
                card._closePlayer = () => {
                    playRequested = false;
                    if (controller) {
                        try { controller.pause(); } catch (e) { console.warn(e); }
                    }
                    playerWrap.classList.remove("open");
                };

                ensureController();

                listenBtn.addEventListener("click", () => {
                    // 他の部屋のプレイヤーは閉じて、押した部屋のプレイヤーだけ表示する
                    audioResults.querySelectorAll(".audio-card").forEach((other) => {
                        if (other !== card && other._closePlayer) other._closePlayer();
                    });

                    if (onListen && !listenLogged) {
                        listenLogged = true;
                        onListen();
                    }

                    if (playerWrap.classList.contains("open")) return;

                    ensureController();
                    if (!controller && !creating) {
                        // Spotify APIがまだ読み込まれていない
                        note.classList.remove("hidden");
                        return;
                    }
                    note.classList.add("hidden");
                    playerWrap.classList.add("open");
                    playRequested = true;
                    if (controller) controller.play();
                });

                return card;
            }

            matchBtn.addEventListener("click", () => {
                matchBtn.disabled = true;
                audioResults.innerHTML = "";
                playerContainer.style.display = "none";
                candidateMessage.classList.add("hidden");
                playerNotice.classList.add("hidden");
                retryMessage.classList.add("hidden");
                resetFeedbackUI();
                statusArea.textContent = "サーバーへ画像送信中...\n照合しています...";

                const ctx = canvas.getContext("2d");
                canvas.width = video.videoWidth || 640;
                canvas.height = video.videoHeight || 480;
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

                canvas.toBlob((blob) => {
                    if (!blob) {
                        statusArea.textContent = "画像データの取得に失敗しました。";
                        matchBtn.disabled = false;
                        return;
                    }

                    // 撮影が完了した時点で、送信する画像を表示して「判定中」に切り替える
                    // （この時点でカメラを動かしても判定には影響しない）
                    if (capturedUrl) URL.revokeObjectURL(capturedUrl);
                    capturedUrl = URL.createObjectURL(blob);
                    capturedImage.src = capturedUrl;
                    judgingIndicator.classList.remove("hidden");
                    statusArea.classList.add("hidden");
                    backBtn.disabled = true;
                    showResultScreen();

                    const formData = new FormData();
                    formData.append("image", blob, "capture.jpg");

                    fetch(`${SERVER_IP}/predict`, {
                        method: "POST",
                        body: formData,
                        headers: {
                            "ngrok-skip-browser-warning": "true"
                        }
                    })
                    .then((response) => {
                        if (!response.ok) {
                            throw new Error(`HTTPエラー: ${response.status}`);
                        }
                        return response.json();
                    })
                    .then((result) => {
                        // ランキング全件を「n位：対象　距離 x.xxxx」の形式で並べ、
                        // 1位と2位の行の間に距離差を挿入する
                        let logText = "===== 判定詳細 =====\n\n";

                        result.ranking.forEach((item, index) => {
                            const rank = index + 1;
                            logText += `${rank}位：${getRoomLabel(item.name)}　距離 ${item.min.toFixed(4)}\n`;

                            if (rank === 2 && result.gap !== null && result.gap !== undefined) {
                                logText += `1位と2位の距離差：${result.gap.toFixed(4)}\n`;
                            }
                        });

                        logText += `\n1つ目の閾値: ${result.threshold}\n`;

                        if (result.gap_threshold !== null && result.gap_threshold !== undefined) {
                            logText += `2つ目の閾値: ${result.gap_threshold}\n`;
                        }

                        showResultScreen();

                        if (!result.success) {
                            logText += "\n判定に失敗しました\n距離が閾値以上です。";
                            statusArea.textContent = logText;
                            retryMessage.classList.remove("hidden");
                            return;
                        }

                        // 判定に成功した場合のみ、正誤フィードバックを受け付ける
                        if (result.filename) {
                            showFeedbackUI(result.filename);
                        }

                        // Spotifyプレイヤーが表示される場合は、再生ボタンが
                        // 押せないことがある旨の案内を常に表示する
                        playerNotice.classList.remove("hidden");

                        if (result.low_confidence) {
                            candidateMessage.classList.remove("hidden");
                            logText += "\n※距離差が小さいため候補を表示しています。";
                            statusArea.textContent = logText;

                            const top3 = result.ranking.slice(0, 3);
                            top3.forEach((item, index) => {
                                const card = createRoomCard(
                                    `候補${index + 1}：${getRoomLabel(item.name)}`,
                                    item,
                                    () => sendCandidateSelection(item.name)
                                );
                                audioResults.appendChild(card);
                            });
                        } else {
                            logText += "\n距離差が十分に大きいため1位を採用しました。";
                            statusArea.textContent = logText;

                            const bestName = result.best_match;
                            audioResults.appendChild(createRoomCard(getRoomLabel(bestName), { name: bestName }));
                            if (!SPOTIFY_EPISODES[bestName]) {
                                statusArea.textContent = logText + "\nSpotify URIが見つかりません。";
                            }
                        }
                    })
                    .catch((err) => {
                        showResultScreen();
                        statusArea.textContent =
                            `\n通信エラー\n\n` +
                            `■ 確認すること\n` +
                            `1. Flask (app.py) が起動しているか\n` +
                            `2. ngrok が起動しているか\n` +
                            `3. ngrokの警告ページで止まっていないか\n\n` +
                            `詳細:\n${err.message}\n`;
                    })
                    .finally(() => {
                        judgingIndicator.classList.add("hidden");
                        statusArea.classList.remove("hidden");
                        backBtn.disabled = false;
                        matchBtn.disabled = false;
                    });
                }, "image/jpeg", 0.8);
            });

            // 外カメラ／インカメラの切り替え
            switchCameraBtn.addEventListener("click", () => {
                currentFacingMode = currentFacingMode === "environment" ? "user" : "environment";
                startCamera();
            });

            backBtn.addEventListener("click", () => {
                audioResults.innerHTML = "";
                candidateMessage.classList.add("hidden");
                playerNotice.classList.add("hidden");
                retryMessage.classList.add("hidden");
                resetFeedbackUI();
                statusArea.textContent = "判定結果を表示しています...";
                playerContainer.style.display = "none";
                if (capturedUrl) {
                    URL.revokeObjectURL(capturedUrl);
                    capturedUrl = null;
                }
                capturedImage.removeAttribute("src");
                showCameraScreen();
            });

            // 初期化時にカメラ起動
            startCamera();
        });
    </script>
</body>
</html>
