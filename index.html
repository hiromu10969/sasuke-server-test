<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>Sasuke Guide - Client Server</title>

    <style>
        body {
            font-family: sans-serif;
            margin: 0;
            padding: 0;
            background-color: #121212;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            font-size: 1.2rem;
            margin: 10px 0;
        }

        #video-container {
            position: relative;
            width: 90%;
            max-width: 400px;
            aspect-ratio: 3 / 4;
            background-color: black;
            border-radius: 8px;
            overflow: hidden;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .btn {
            width: 90%;
            max-width: 400px;
            padding: 15px;
            margin: 15px 0;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
        }

        .btn:disabled {
            background-color: #555;
        }

        #status-area {
            width: 85%;
            max-width: 380px;
            padding: 15px;
            background-color: #1e1e1e;
            border-radius: 8px;
            font-size: 0.9rem;
            white-space: pre-wrap;
            border: 1px solid #333;
            margin-bottom: 15px;
        }

        /* Spotify プレイヤーの設置エリア */
        #embed-iframe-container {
            width: 90%;
            max-width: 400px;
            margin-bottom: 20px;
            min-height: 152px;
        }

        canvas {
            display: none;
        }
    </style>
    
    <!-- Spotify iFrame API のスクリプト -->
    <script src="https://open.spotify.com/embed/iframe-api/v1" async></script>
</head>

<body>

    <h1>旧豊田佐助邸 画像認識音声ガイド</h1>

    <div id="video-container">
        <video id="camera-view" autoplay playsinline muted></video>
    </div>

    <button id="match-btn" class="btn" disabled>
        カメラ起動中...
    </button>

    <div id="status-area">
        システムを初期化しています...
    </div>

    <!-- Spotify iFrame プレイヤーが生成される場所 -->
    <div id="embed-iframe-container">
        <div id="embed-iframe"></div>
    </div>

    <canvas id="capture-canvas" width="640" height="480"></canvas>

    <script>
        // =========================================================
        // 【超重要】
        // ngrok を起動するたびに毎回ここを書き換える
        // =========================================================
        const SERVER_IP = "https://gallantly-gosling-refrain.ngrok-free.dev";

        // =========================================================
        // 各展示物に対応する Spotify ポッドキャストのエピソード URI マップ
        // ※ ID（spotify:episode:xxxx の xxxx の部分）をご自身の実際のエピソードIDに書き換えてください
        // =========================================================
        const SPOTIFY_EPISODES = {
            "お気に入りの部屋": "https://open.spotify.com/episode/3c02kQl95palK7PEBBpSdz?si=f04c0f972185467b",
            "ガス灯": "https://open.spotify.com/episode/78j0VmMwSKyguwanEBLbEv?si=90b1771f97d14b6e",
            "きんだみ襖": "https://open.spotify.com/episode/5xXtixpynrC8JlXOoP3V9b?si=03670599321e479d",
            "シャンデリア": "https://open.spotify.com/episode/0DvrHzuccMeEtGWMjDASwO?si=b931f0e4aa2541aa",
            "ステレオ": "https://open.spotify.com/episode/3c02kQl95palK7PEBBpSdz?si=f04c0f972185467b",
            "トイレ": "https://open.spotify.com/episode/6nLezXa07BedIgkEicr3gI?si=4c4c2a285b9840b3",
            "引手": "https://open.spotify.com/episode/3c02kQl95palK7PEBBpSdz?si=f04c0f972185467b",
            "夏障子": "https://open.spotify.com/episode/3c02kQl95palK7PEBBpSdz?si=f04c0f972185467b",
            "換気口": "https://open.spotify.com/episode/5x764PkVzDgiFCYg2ggqRS?si=2a5b717b214b4bbf",
            "筋交": "https://open.spotify.com/episode/7HMlKfKZyujAcvR7OY1y3v?si=1def4d606fdf49b3",
            "波型無双連子": "https://open.spotify.com/episode/3c02kQl95palK7PEBBpSdz?si=f04c0f972185467b",
            "覆輪目地": "https://open.spotify.com/episode/3c02kQl95palK7PEBBpSdz?si=f04c0f972185467b"
        };

        const video = document.getElementById('camera-view');
        const canvas = document.getElementById('capture-canvas');
        const matchBtn = document.getElementById('match-btn');
        const statusArea = document.getElementById('status-area');

        // Spotify Controller 用の変数
        let embedController = null;

        // =========================================================
        // Spotify iFrame API 初期化
        // =========================================================
        window.onSpotifyIframeApiReady = (IFrameAPI) => {
            const element = document.getElementById('embed-iframe');
            const options = {
                width: '100%',
                height: '152',
                // 初期状態としてデフォルトの曲/ポッドキャストを指定（空読み込み用）
                uri: SPOTIFY_EPISODES["ガス灯"] 
            };
            
            const callback = (EmbedController) => {
                embedController = EmbedController;
                console.log("Spotify Controller 準備完了");
            };
            
            IFrameAPI.createController(element, options, callback);
        };

        async function initCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        facingMode: "environment",
                        width: 640,
                        height: 480
                    },
                    audio: false
                });
                video.srcObject = stream;
                statusArea.textContent = "準備完了。\n展示物を映して判定開始ボタンを押してください。";
                matchBtn.textContent = "判定開始";
                matchBtn.disabled = false;
            } catch (err) {
                statusArea.textContent = `カメラ起動エラー:\n${err.message}`;
            }
        }

        matchBtn.addEventListener('click', async () => {
            matchBtn.disabled = true;

            statusArea.textContent = "サーバーへ画像送信中...\n照合しています...";

            const ctx = canvas.getContext('2d');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            canvas.toBlob(async (blob) => {
                const formData = new FormData();
                formData.append('image', blob, 'capture.jpg');

                try {
                    const response = await fetch(`${SERVER_IP}/predict`, {
                        method: 'POST',
                        body: formData
                    });

                    if (!response.ok) {
                        throw new Error(`HTTPエラー: ${response.status}`);
                    }

                    const result = await response.json();
                    let logText = "";
                    logText += "===== 判定結果 =====\n\n";
                    logText += `判定: ${result.best_match}\n`;
                    logText += `距離: ${result.distance.toFixed(4)}\n`;
                    logText += `閾値: ${result.threshold}\n\n`;

                    // ランキング表示
                    if (result.ranking) {
                        logText += "===== ランキング =====\n\n";
                        result.ranking.forEach((item, index) => {
                            logText += `${index + 1}位 ${item.name}\n` +
                                       `最小値: ${item.min.toFixed(4)}\n` +
                                       `平均値: ${item.avg.toFixed(4)}\n` +
                                       `登録枚数: ${item.count}\n\n`;
                        });
                    }

                    if (result.success) {
                        logText += "判定成功\nSpotify音声を再生します\n";

                        const episodeUri = SPOTIFY_EPISODES[result.best_match];

                        if (episodeUri && embedController) {
                            logText += `URI: ${episodeUri}\n`;
                            
                            // 該当エピソードを読み込んで再生
                            embedController.loadUri(episodeUri);
                            embedController.play();
                            
                            statusArea.textContent = logText + "\n再生開始処理完了";
                        } else {
                            logText += "Spotify URI または Player が見つかりません";
                            statusArea.textContent = logText;
                        }
                    } else {
                        logText += "判定に失敗しました\n角度を変えて撮影し直してください";
                        statusArea.textContent = logText;
                    }
                } catch (err) {
                    statusArea.textContent = `\n通信エラー\n\n■ 確認すること\n\n1. app.py が起動しているか\n2. ngrok が起動しているか\n3. SERVER_IP が正しいか\n4. Flask が落ちていないか\n\n詳細:\n${err.message}\n`;
                } finally {
                    matchBtn.disabled = false;
                }
            }, 'image/jpeg', 0.8);
        });

        window.addEventListener('DOMContentLoaded', initCamera);
    </script>

</body>
</html>
